  /* ─── tokens ───────────────────────────────────────────────

  /* ─── faces ─────────────────────────────────────────────── */

  html { -webkit-text-size-adjust: 100%; }

  #app {

  .meter[data-k="hybris"] .meter-fill { background: var(--wine); }

  /* ─── stage ─────────────────────────────────────────────── */

  #stage {

  .choice:hover:not(:disabled) {

  .choice:disabled { cursor: default; opacity: .38; }

  /* ─── chapter engravings ────────────────────────────────── */

  }

  .plate figcaption {
    margin-top: 9px;
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  /* The plates are bronze line-work baked onto the wine-dark ground.
     At dawn they are inverted to dark ink, then multiplied against the
     figure's own ground so the plate's background dissolves into the
     page instead of sitting there as a pale rectangle. */
  .plate figure, .plate { background: var(--ground); }

  .plate img { mix-blend-mode: screen; }

  :root[data-theme="light"] .plate img,
  :root:not([data-theme="dark"]) .plate img {
    filter: invert(1) hue-rotate(180deg) saturate(1.25);
    mix-blend-mode: multiply;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .plate img {

      mix-blend-mode: screen;

  /* ─── voyage map ────────────────────────────────────────── */

  .mapwrap {

  .lockup {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 32px;
  }

  .lockup .wordmark {
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .lockup .role {
    font-family: var(--display);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding-left: 13px;
    border-left: 1px solid var(--line);
  }

  .attrib summary {

  .credit { margin-top: 58px; }

  .credit::before {

    height: 2px;

  /* ─── foot ──────────────────────────────────────────────── */

  #foot {

    /* Bring the landing's call to action nearer the fold. */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<script>
(() => {
  "use strict";

  /* ══ the sea ══════════════════════════════════════════════
     A slow field of horizontal swells. `rage` climbs the
     moment Poseidon is given a reason, and the water gets
     faster, taller and redder for the rest of the voyage. */

  const cv = document.getElementById("sea");
  const cx = cv.getContext("2d");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, t = 0, rage = 0, target = 0;
  let waveRGB = [61, 44, 73], wineRGB = [179, 76, 88], inkWeight = 1;

  function readPalette() {
    const cs = getComputedStyle(document.documentElement);
    waveRGB = parseHex(cs.getPropertyValue("--wave"));
    wineRGB = parseHex(cs.getPropertyValue("--wine"));

    // Dark ink on a pale ground reads much harder than pale ink on a
    // dark one, so the dawn theme gets a far fainter sea.
    const g = parseHex(cs.getPropertyValue("--ground"));
    const lum = (g[0] * 0.299 + g[1] * 0.587 + g[2] * 0.114) / 255;
    inkWeight = lum > 0.5 ? 0.34 : 1;
  }

  function parseHex(s) {
    const h = s.trim().replace("#", "");
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) || 0);
  }

  function size() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * d; cv.height = H * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }

  function draw() {
    rage += (target - rage) * 0.012;
    cx.clearRect(0, 0, W, H);

    const mix = rage;
    const r = Math.round(waveRGB[0] + (wineRGB[0] - waveRGB[0]) * mix * 0.75);
    const g = Math.round(waveRGB[1] + (wineRGB[1] - waveRGB[1]) * mix * 0.75);
    const b = Math.round(waveRGB[2] + (wineRGB[2] - waveRGB[2]) * mix * 0.75);

    const rows = 26;
    const gap = H / rows;
    cx.lineWidth = 1;

    for (let i = 0; i < rows; i++) {
      const y0 = i * gap + gap * 0.5;
      const depth = i / rows;
      const amp = (3 + depth * 16) * (1 + rage * 1.7);
      const len = 190 - depth * 90;
      const speed = (0.16 + depth * 0.3) * (1 + rage * 2.2);
      const alpha = (0.16 + depth * 0.4) * (1 + rage * 0.5) * inkWeight;

      cx.strokeStyle = `rgba(${r},${g},${b},${Math.min(alpha, 0.75)})`;
      cx.beginPath();
      for (let x = 0; x <= W + 8; x += 8) {
        const y = y0
          + Math.sin((x / len) + t * speed + i * 1.7) * amp
          + Math.sin((x / (len * 0.43)) - t * speed * 1.6 + i) * amp * 0.35 * rage;
        x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
      }
      cx.stroke();
    }

    t += calm ? 0 : 0.012;
    requestAnimationFrame(draw);
  }

  readPalette();
  size();
  addEventListener("resize", size);
  new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class", "style"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(readPalette, 60));
  requestAnimationFrame(draw);

  /* ══ state ═══════════════════════════════════════════════ */

  const traits = { metis: 0, hybris: 0, nostos: 0 };
  const CAP = { metis: 7, hybris: 5, nostos: 6 };
  let idx = 0;

  const stage = document.getElementById("stage");
  const bar = document.getElementById("bar");
  const marksEl = document.getElementById("marks");
  const metersEl = document.getElementById("meters");

  metersEl.innerHTML = ["metis", "hybris", "nostos"].map(k => `
    <div class="meter" data-k="${k}">
      <span class="meter-name">${k === "metis" ? "Mētis" : k === "hybris" ? "Hybris" : "Nostos"}</span>
      <span class="meter-track"><span class="meter-fill" data-f="${k}"></span></span>
    </div>`).join("");

  function paintMeters() {
    for (const k in traits) {
      const el = metersEl.querySelector(`[data-f="${k}"]`);
      el.style.width = Math.min(100, (traits[k] / CAP[k]) * 100) + "%";
    }
  }

  function paintMarks() {
    marksEl.innerHTML = CH.map((_, i) =>
      `<span class="mark ${i < idx ? "done" : i === idx ? "now" : ""}"></span>`
    ).join("");
  }

  /* ══ the chapters ════════════════════════════════════════ */

  const CH = [
    {
      eyebrow: "Before the poem · Ithaca",
      title: "The Oath",
      scene: `<p>You are <b>Odysseus</b>, king of Ithaca — a goat-rock island with no great army. You are not the strongest man in Greece and never pretend to be. You are the cleverest, and everyone knows it.</p>
        <p>Word comes from the mainland. Paris, a prince of Troy, has taken <b>Helen</b>, wife of the Spartan king <b>Menelaus</b>. His brother <b>Agamemnon</b> is calling in an old oath: every Greek king once swore to defend that marriage.</p>
        <p>Your wife <b>Penelope</b> has just given you a son. He is a few months old.</p>`,
      choices: [
        { t: "Sail. An oath is an oath.", v: "Honourable. Not remotely your style.", d: { hybris: 0 } },
        { t: "Feign madness and let them find another king.", v: "Correct — this is exactly what you tried.", d: { metis: 1 } },
        { t: "Send the ships, stay behind.", v: "Ithaca owns twelve ships in total. They would notice.", d: { nostos: 1 } }
      ],
      truthTag: "What Homer’s world actually says",
      truth: `<p>You yoked an ox and a donkey together, pulled on a felt cap, and plowed a field sowing it with salt — a madman, unfit to fight. The recruiter laid your infant son <b>Telemachus</b> in the path of the plow. You swerved.</p>
        <p>You were sane, and you were caught. You sailed. The war took ten years.</p>`,
      watch: `Odysseus leaves as a brand-new father. Every year of this story is a year of that boy growing up without him. When the film shows you Telemachus, he is twenty years old and has never met his father.`
    },

    {
      eyebrow: "Year ten · The plain of Troy",
      title: "The Horse",
      scene: `<p>Ten years of siege. <b>Achilles</b> is dead, shot in the heel. <b>Hector</b> is dead, dragged behind a chariot in front of his own family. The walls of Troy have not been breached and, at this rate, will not be. Both armies are hollowed out.</p>
        <p>Agamemnon asks the council for anything.</p>`,
      choices: [
        { t: "One more assault at dawn.", v: "That has been the last ten years. It does not work.", d: {} },
        { t: "Build something the Trojans will carry inside the walls themselves.", v: "Yes. That is the mind the whole poem is built around.", d: { metis: 2 } },
        { t: "Starve them out. Cut the supply lines.", v: "Troy has a harbour and allies. You starve first.", d: {} }
      ],
      truthTag: "What happened",
      truth: `<p>The horse was your idea: a hollow offering to Athena, deliberately built too tall for the gates, with you and the best fighters folded up inside. The fleet sailed over the horizon and hid. The Trojans broke their own wall to bring the gift in, and spent the night celebrating. Then you opened the hatch.</p>
        <p>Greek has two words for how a man wins. <span class="gk">Biē</span> — force. <span class="gk">Mētis</span> — cunning. Achilles is <span class="gk">biē</span>; the <i>Iliad</i> belongs to him. You are <span class="gk">mētis</span>, and the <i>Odyssey</i> belongs to you.</p>`,
      watch: `This is the poem about the second kind of hero. Expect the wins to come from tricks, disguises, false names and patience — not from duels. When he wins a fight in the film, look at how.`
    },

    {
      eyebrow: "The first year home · An island of giants",
      title: "The Cave",
      scene: `<p>You sail for Ithaca with twelve ships. You stop at an island for supplies and find a cave stacked with cheese and penned lambs. Then the owner comes home: <b>Polyphemus</b>, a one-eyed giant the size of a cliff, and a son of <b>Poseidon</b>. He rolls a boulder across the door.</p>
        <p>Greek law is <span class="gk">xenia</span>: a host feeds his guest, gives him a gift, and only then asks his name. Polyphemus eats two of your men instead.</p>
        <p>So you get him drunk. You tell him your name is <b>Nobody</b>. You drive a sharpened olive stake into his eye, and when he screams the other giants hear <i>“Nobody is killing me!”</i> and go back to bed. At dawn you escape strapped under the bellies of his sheep.</p>
        <p>Your ship pulls away. He is up on the cliff, blind, hurling boulders at the sound of your oars.</p>`,
      choices: [
        { t: "Say nothing. Row.", v: "The smart move. It is not the one you made.", d: { metis: 1 } },
        { t: "Shout your real name, so he knows exactly who beat him.", v: "Yes. And it costs you everything you have left.", d: { hybris: 3 } },
        { t: "Shout an insult, but no name.", v: "Close. But you wanted the credit, not the last word.", d: { hybris: 1 } }
      ],
      truthTag: "The hinge of the entire story",
      truth: `<p>You stood up in the stern and gave him the full formula: <i>Odysseus, sacker of cities, son of Laertes, whose home is Ithaca.</i></p>
        <p>Polyphemus lifted his hands to his father and prayed. Not for your death — for something worse. Let this man reach home <b>late</b>, and <b>broken</b>, and <b>alone</b>, in a stranger’s ship. And let him find trouble waiting in his house.</p>
        <p>Poseidon heard him. Everything that happens across the next ten years is that one sentence of pride, granted in full, item by item.</p>`,
      watch: `This is the engine. When the sea comes for him on screen, it is not weather — it is a god with a personal grudge, because Odysseus could not bear to win anonymously.`,
      rage: 1
    },

    {
      eyebrow: "Ten years · The wrong sea",
      title: "The Long Way",
      scene: `<p>Poseidon takes his time about it. Below is the route — these are the episodes every adaptation draws its set pieces from, and the ones people will assume you know.</p>`,
      log: [
        ["The Lotus Eaters", "A shore where the food makes you forget you ever had a home. He has to drag his own men back to the ships, weeping, and tie them to the benches."],
        ["The Bag of Winds", "The wind king Aiolos gifts him every storm sealed in an ox-hide bag. Ithaca comes into sight — close enough to see men on the beaches — and the crew opens the bag looking for hidden gold. They are blown the entire way back."],
        ["The Laestrygonians", "Cannibal giants sink eleven of his twelve ships in one afternoon. Almost everyone he has known for twenty years dies in a single scene."],
        ["Circe", "A goddess on the island of Aiaia turns his men into pigs. He resists her drug, becomes her lover, and stays a year. She is also the one who tells him the way home runs through the land of the dead."],
        ["The Dead", "At the edge of the world he pours blood into a trench and the ghosts come to drink. The blind prophet Tiresias gives him the route. He meets his own mother, dead of grief from waiting, and tries three times to hold her. Achilles tells him he would rather be a slave alive than a king among the dead."],
        ["The Sirens", "Singers whose song is knowledge itself; the shore around them is heaped with bones. He seals his crew’s ears with wax and has himself lashed to the mast — the only man who hears it and lives. He begs to be untied. They row on."],
        ["Scylla and Charybdis", "A strait with a six-headed monster on one cliff and a ship-swallowing whirlpool on the other. He is told plainly: pass Scylla and lose six men, or pass Charybdis and lose everyone. He steers at Scylla, and does not warn the six."],
        ["The Cattle of the Sun", "Becalmed and starving beside a herd they are forbidden to touch. He falls asleep. They eat. Zeus splits the ship with lightning and every last man drowns. Odysseus alone washes up on Calypso’s beach."]
      ],
      logGate: `<p><b>Calypso.</b> Seven years pass there. The goddess wants to keep him and she is not lying about the terms: stay, and she will make you <b>immortal and ageless</b>, forever, with her.</p>
        <p>Ithaca is twenty years cold. Penelope has aged. She may have remarried. She may be dead.</p>`,
      choices: [
        { t: "Take it. Immortality, with a goddess, on a beautiful island.", v: "No one in Greek myth is ever offered more. He turns it down flat.", d: {} },
        { t: "A raft, alone. Home, or drown trying.", v: "Yes — and that choice is the entire argument of the poem.", d: { nostos: 3 } }
      ],
      truthTag: "Why this is the answer, not the delay",
      truth: `<p>He sits on her beach and cries at the horizon until the gods make her release him. Then he builds a raft, by hand, and leaves alone.</p>
        <p>He chooses an ageing wife and a rocky island over being a god. The <i>Odyssey</i>’s argument is that a mortal life with a home in it is worth more than eternity without one. That is the thesis. Everything else is monsters.</p>
        <p>He is not unguarded, either. <b>Athena</b>, goddess of wisdom and craft, has adopted him — she likes him precisely because he lies beautifully. Poseidon wants him drowned. They argue about him on Olympus, out loud, and the gods’ side of the story is told openly.</p>`,
      watch: `If the film opens with gods discussing him before you have even seen his face — that is not an invention. That is Homer, almost exactly.`
    },

    {
      eyebrow: "Meanwhile · Ithaca, year twenty",
      title: "The House",
      scene: `<p>Now look at what he is coming home to.</p>
        <p>Twenty years gone. Everyone reasonable assumes he is dead. <b>One hundred and eight</b> young noblemen from the surrounding islands have moved into his hall. They butcher his herds daily, drain his cellar, sleep with his maids and humiliate his son — all while formally “courting” Penelope. Under <span class="gk">xenia</span> she cannot simply throw guests out of the house. Their ringleader, <b>Antinous</b>, is quietly planning to murder Telemachus.</p>
        <p>She has held them off for three years with a single trick: she will choose a husband on the day she finishes weaving a burial shroud for Odysseus’s old father.</p>`,
      choices: [
        { t: "She weaves slowly.", v: "Slower than that.", d: {} },
        { t: "Every night she unpicks the whole day’s weaving.", v: "Exactly. Three years of it, until one of her maids sold her out.", d: { metis: 2 } },
        { t: "She’s stalling until help arrives.", v: "No help is coming and she knows it. She is entirely on her own.", d: { nostos: 1 } }
      ],
      truthTag: "The other clever one",
      truth: `<p>By day she wove. By night, by torchlight, she pulled it apart again. Three years. A maid betrayed her, the suitors forced the shroud finished, and that is precisely why the twentieth year is the year everything breaks.</p>
        <p>Read the trick once more: a sustained lie, held for years, executed by hand, under surveillance, with a knife at her son’s throat. Penelope is not a prize sitting at the end of the story. She is the same species of person her husband is, and Homer builds the reunion around that fact.</p>`,
      watch: `The marriage at the centre of this film is between two extraordinary liars who are entirely faithful to each other. Watch what Penelope <i>does</i>, not what is done to her.`
    },

    {
      eyebrow: "The return · The great hall",
      title: "The Beggar and the Bow",
      scene: `<p>He reaches Ithaca at last, put ashore asleep by strangers. Athena disguises him as a filthy old beggar, and he walks into his own kingdom unrecognised.</p>
        <p>He goes first to <b>Eumaeus</b>, his swineherd, who kills his last good pig to feed a stranger — the poem’s model of <span class="gk">xenia</span> done right. In a hut he reveals himself to Telemachus. They plan.</p>
        <p>In the hall the suitors mock the beggar and throw a footstool at him. By the door, an old dog lying on a dung heap lifts his head: <b>Argos</b>, the puppy he trained twenty years ago and never saw grown. He wags his tail once, and dies. Odysseus wipes his eyes and keeps his cover.</p>
        <p>His old nurse <b>Eurycleia</b> washes the beggar’s feet and finds a boar-scar on his thigh. He takes her by the throat and tells her to be silent.</p>
        <p>Then Penelope announces a contest. String Odysseus’s great bow, and put an arrow through the sockets of twelve axe-heads set in a row. Not one suitor can even bend it. The beggar asks for a turn.</p>`,
      choices: [
        { t: "Reveal yourself first. Give them the chance to run.", v: "Mercy is not the mode here. He has spent days counting every insult.", d: { nostos: 1 } },
        { t: "String it, take the shot, then turn the bow on the room.", v: "Yes. And he does it without changing his expression.", d: { metis: 1, hybris: 1 } }
      ],
      truthTag: "What happens",
      truth: `<p>He strings the bow the way a musician strings a lyre — that is Homer’s own comparison, and it tells you everything about how easy it is for him — and sends the arrow clean through all twelve.</p>
        <p>Then he steps onto the threshold, empties the quiver at his feet, and shoots Antinous through the throat mid-swallow. Telemachus, Eumaeus and the cowherd hold the doors. They kill every one of them.</p>`,
      watch: `This is the payoff of every disguise in the film. And notice who is standing beside him: his son and two servants. Not an army. He comes home with nothing and takes the house back with four people.`
    },

    {
      eyebrow: "The last test",
      title: "The Bed",
      scene: `<p>The hall is cleared. He washes. Athena makes him beautiful again. He stands in front of his wife and says: it is me.</p>
        <p>Penelope says nothing at all. She sits down across the fire and looks at him. Telemachus calls her hard-hearted.</p>

  /* ══ the voyage map ══════════════════════════════════════
     A route diagram, not a survey. Nobody agrees where most of
     these places were, so the geography is suggestive: Troy east,
     Ithaca west of Greece, the wandering out into the far west.
     `log` is the index of the log entry that lights each stop. */

  const ROUTE = [
    { n: "Troy",              x: 770, y: 92,  lit: true },
    { n: "Lotus Eaters",      x: 600, y: 330, log: 0 },
    { n: "The Cyclops",       x: 470, y: 300, lit: true },
    { n: "Bag of Winds",      x: 390, y: 232, log: 1 },
    { n: "Laestrygonians",    x: 330, y: 150, log: 2 },
    { n: "Circe",             x: 250, y: 222, log: 3 },
    { n: "The Dead",          x: 95,  y: 132, log: 4 },
    { n: "The Sirens",        x: 215, y: 306, log: 5 },
    { n: "Scylla",            x: 330, y: 346, log: 6 },
    { n: "Cattle of the Sun", x: 445, y: 370, log: 7 },
    { n: "Calypso",           x: 520, y: 250, calypso: true },
    { n: "Ithaca",            x: 640, y: 160, home: true }
  ];

  function voyageMap() {
    const swells = Array.from({ length: 9 }, (_, i) => {
      const y = 26 + i * 46;
      let d = `M0 ${y}`;
      for (let x = 40; x <= 820; x += 40) d += ` Q${x - 20} ${y - 7} ${x} ${y}`;
      return `<path class="swell" d="${d}"/>`;
    }).join("");

    const legs = ROUTE.slice(1).map((s, i) => {
      const p = ROUTE[i];
      return `<line class="leg" data-leg="${i + 1}" x1="${p.x}" y1="${p.y}" x2="${s.x}" y2="${s.y}"/>`;
    }).join("");

    const stops = ROUTE.map((s, i) => {
      const right = s.x > 470;
      const lx = right ? s.x - 13 : s.x + 13;
      const mark = s.home
        ? `<circle class="stop anchor" data-stop="${i}" cx="${s.x}" cy="${s.y}" r="7"/>`
        : `<rect class="stop" data-stop="${i}" x="${s.x - 4}" y="${s.y - 5}" width="7" height="10"
             transform="skewX(-16) translate(${s.y * 0.287} 0)"/>`;
      return mark + `<text class="label${s.home ? " anchor-label" : ""}" data-label="${i}"
          x="${lx}" y="${s.y + 4}" text-anchor="${right ? "end" : "start"}">${s.n}</text>`;
    }).join("");

    return `<div class="mapwrap">
      <svg class="voyage" viewBox="0 62 820 340" role="img"
           aria-label="Route from Troy to Ithaca with the stops of the voyage">
        ${swells}${legs}${stops}
      </svg>
    </div>
    <p class="maphint">Ten years, and Ithaca was never far. Open the log to trace the route.</p>`;
  }

  /* Repaint from ROUTE state: lit stops, and legs whose ends are both lit. */
  function paintMap() {
    const svg = stage.querySelector(".voyage");
    if (!svg) return;
    ROUTE.forEach((s, i) => {
      if (!s.lit) return;
      svg.querySelector(`[data-stop="${i}"]`)?.classList.add("lit");
      svg.querySelector(`[data-label="${i}"]`)?.classList.add("lit");
      if (i > 0 && ROUTE[i - 1].lit) svg.querySelector(`[data-leg="${i}"]`)?.classList.add("lit");
    });
  }

  function reach(pred) {
    const s = ROUTE.find(pred);
    if (s) s.lit = true;
    paintMap();
  }

  /* ══ rendering ═══════════════════════════════════════════ */

  function title() {
    stage.innerHTML = `
      <section class="scene" style="padding-top:5vh">
        <div class="lockup">
          <span class="upd-mark" role="img" aria-label="Unpredator"></span>
          <span class="wordmark">Unpredator</span>
          <span class="role">A fun experiment</span>
        </div>
        <p class="eyebrow">Before you go to the cinema</p>
        <h1>Nostos<span class="sub">Everything you need before The Odyssey</span></h1>

        <div class="spirit">
          <p>The <i>Odyssey</i> is one of the great masterpieces of human culture. Three thousand years old, and still the best thing anybody has written about wanting to go home.</p>
          <p>Christopher Nolan has now filmed it, the first feature ever shot entirely on IMAX 70mm. You can walk in cold and have a good time. You will have a far better one if you know who these people are before the lights go down.</p>
          <p>So here are five minutes. You play as Odysseus through the seven decisions the story turns on, and every choice ends with what to watch for on screen. Go in prepared, and the film becomes a story you are already inside instead of a spectacle you are watching.</p>
        </div>

        <ul class="chips">
          <li>Five minutes</li>
          <li>Seven decisions</li>
          <li>No spoilers</li>
          <li>Cast list at the end</li>
        </ul>

        <div class="actions">
          <button class="go" id="start">Put out to sea</button>
        </div>
      </section>`;
    document.getElementById("start").onclick = () => { bar.hidden = false; render(); };
  }

  function render() {
    const c = CH[idx];
    paintMarks();

    stage.innerHTML = `
      <section class="scene">
        <p class="eyebrow">${c.eyebrow}</p>
        <h2>${c.title}</h2>
        ${plate(idx)}
        <div class="prose">${c.scene}</div>
        ${c.log ? voyageMap() + logMarkup(c) : ""}
        <div id="tail" ${c.log ? "hidden" : ""}>
          ${c.logGate ? `<div class="prose" style="margin-top:30px">${c.logGate}</div>` : ""}
          <div class="choices" id="choices">
            ${c.choices.map((ch, i) => `<button class="choice" data-i="${i}">${ch.t}</button>`).join("")}
          </div>
        </div>
      </section>`;

    if (c.log) { paintMap(); wireLog(c); }
    wireChoices(c);
    scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
  }

  function logMarkup(c) {
    return `<div class="log" id="log">
      ${c.log.map((r, i) => `
        <button class="logrow" data-i="${i}">
          <span class="logrow-head">
            <span class="logrow-n">${String(i + 1).padStart(2, "0")}</span>
            <span class="logrow-t">${r[0]}</span>
            <span class="logrow-cue">Open</span>
          </span>
        </button>`).join("")}
    </div>
    <p class="logcount" id="logcount">0 / ${c.log.length} logged — open each one</p>`;
  }

  function wireLog(c) {
    let n = 0;
    const count = document.getElementById("logcount");
    document.querySelectorAll(".logrow").forEach(btn => {
      btn.onclick = () => {
        if (btn.classList.contains("open")) return;
        btn.classList.add("open");
        btn.querySelector(".logrow-cue").remove();
        const body = document.createElement("span");
        body.className = "logrow-body";
        body.textContent = c.log[+btn.dataset.i][1];
        btn.appendChild(body);
        reach(r => r.log === +btn.dataset.i);
        n++;
        count.textContent = `${n} / ${c.log.length} logged` + (n === c.log.length ? " — now the offer" : "");
        if (n === c.log.length) {
          traits.metis += 1;
          paintMeters();
          reach(r => r.calypso);
          reach(r => r.home);
          const tail = document.getElementById("tail");
          tail.hidden = false;
          tail.classList.add("scene");
        }
      };
    });
  }

  function wireChoices(c) {
    const wrap = document.getElementById("choices");
    wrap.querySelectorAll(".choice").forEach(btn => {
      btn.onclick = () => {
        const pick = c.choices[+btn.dataset.i];
        wrap.querySelectorAll(".choice").forEach(b => { b.disabled = true; });
        btn.classList.add("picked");
        const v = document.createElement("span");
        v.className = "verdict";
        v.textContent = pick.v;
        btn.appendChild(v);

        for (const k in (pick.d || {})) traits[k] += pick.d[k];
        paintMeters();
        showTruth(c);
      };
    });
  }

  function showTruth(c) {
    const last = idx === CH.length - 1;
    const div = document.createElement("div");
    div.className = "reveal";
    div.innerHTML = `
      <p class="tag">${c.truthTag}</p>
      <div class="prose">${c.truth}</div>
      <div class="watch">
        <p class="tag">Watch for it</p>
        <p>${c.watch}</p>
      </div>
      <div class="actions">
        <button class="go" id="next">${last ? "Come ashore" : "Sail on"}</button>
      </div>`;
    stage.querySelector(".scene").appendChild(div);

    if (c.rage) target = 1;

    const btn = div.querySelector("#next");
    btn.onclick = () => {
      idx++;
      idx >= CH.length ? finish() : render();
    };

    // Nudge down just far enough to show the reveal has opened,
    // without scrolling past the answer they were reading.
    const drop = div.getBoundingClientRect().top - innerHeight * 0.62;
    if (drop > 0) scrollBy({ top: drop, behavior: calm ? "auto" : "smooth" });
  }

  /* One Flaxman plate per chapter, inverted to bronze line-work. */
  function plate(i) {
    const a = ART[i];
    if (!a) return "";
    return `<figure class="plate">
      <img src="${a.img}" alt="${a.title}, engraved after John Flaxman">
      <figcaption>John Flaxman, Plate ${a.plate} — ${a.title}</figcaption>
    </figure>`;
  }

  function portrait(actor) {
    const src = PHOTOS[norm(actor)];
    if (src) return `<img class="portrait" src="${src}" alt="${actor}" loading="lazy" width="60" height="60">`;
    const initials = actor.split(/\s+/).map(w => w[0]).join("").slice(0, 2);
    return `<span class="portrait mono" role="img" aria-label="${actor}">${initials}</span>`;
  }

  /* Cast confirmed against The Hollywood Reporter and Variety
     cast guides. Notes cover the roles the game did not. */
  const CAST = [
    ["Odysseus", "Matt Damon", ""],
    ["Penelope", "Anne Hathaway", ""],
    ["Telemachus", "Tom Holland", ""],
    ["Athena", "Zendaya", ""],
    ["Calypso", "Charlize Theron", ""],
    ["Circe", "Samantha Morton", ""],
    ["Polyphemus", "Bill Irwin", "The Cyclops. Irwin is a Tony-winning stage clown and one of the great physical actors alive, which tells you the giant is being performed rather than rendered."],
    ["Antinous", "Robert Pattinson", "The worst of the suitors, and the first to die."],
    ["Eumaeus", "John Leguizamo", "The swineherd who stays loyal for twenty years."],
    ["Menelaus", "Jon Bernthal", "Helen’s husband. The war is fought to get his wife back."],
    ["Agamemnon", "Benny Safdie", "Menelaus’s brother, who led the Greeks at Troy and was murdered on his own homecoming."],
    ["Helen / Clytemnestra", "Lupita Nyong’o", "One actor, two sisters, on purpose. Helen is the woman the war was fought over. Clytemnestra is the wife who killed Agamemnon when he came home. Together they are everything Penelope could have been and refused to be."],
    ["Eurylochus", "Himesh Patel", "Odysseus’s second in command. The man who argues with him, and who talks the starving crew into eating the Sun god’s cattle."],
    ["Sinon", "Elliot Page", "The Greek who let himself be captured and convinced Troy to pull the horse inside. The single most successful lie in literature."],
    ["Melantho", "Mia Goth", "A maid in the house who sides with the suitors and mocks the beggar."],
    ["Melanthius", "Logan Marshall-Green", "The goatherd who betrays the household. The mirror image of Eumaeus."],
    ["Demodocus", "Travis Scott", "The blind singer at a foreign court who performs the fall of Troy while an unrecognised Odysseus sits and weeps at his own story. Homer putting himself in the poem."]
  ];

  const EXPECT = [
    ["Shot entirely on IMAX 70mm", "The first feature ever made this way. Nolan had sound-dampening housings engineered so the enormous cameras could roll on quiet dialogue as well as action, which had never been possible before."],
    ["Forty-one screens on Earth", "That is how many cinemas can project true IMAX 70mm film. If you are near one, that is the version to see, and it is worth booking well ahead."],
    ["Just under three hours", "Nolan’s second longest film, and reportedly shortened to fit what a 70mm platter can physically hold."],
    ["An enormous ensemble", "Many of these actors get one or two scenes. Recognising a name the moment it is spoken is the difference between a character and a blur, which is most of what the last five minutes bought you."],
    ["It is already a phenomenon", "Released 17 July 2026 to the biggest IMAX opening of Nolan’s career, with 70mm showings selling out weeks in advance."]
  ];

  function finish() {
    paintMarks();
    const top = Object.keys(traits).reduce((a, b) => (traits[a] / CAP[a] >= traits[b] / CAP[b] ? a : b));
    const spread = Math.max(...Object.keys(traits).map(k => traits[k] / CAP[k])) -
                   Math.min(...Object.keys(traits).map(k => traits[k] / CAP[k]));

    const EPI = {
      balanced: ["Polýtropos", "Of many turns", "You steered exactly as he does — clever, proud and homesick in roughly equal measure. This is the epithet Homer opens the poem with."],
      metis:    ["Polýmētis", "Of many counsels", "You reached for the trick every time. So does he: the man who beat Troy with carpentry and beat a giant with a pun."],
      hybris:   ["Megalḗtōr", "Great-hearted, and it is not always a compliment", "You wanted the credit. So did he, once, from the deck of a ship — and it cost him a decade and every man he sailed with."],
      nostos:   ["Polýtlas", "Much-enduring", "You chose home over everything offered instead: a goddess, an island, immortality. That is the choice the entire poem is built to make you feel."]
    };
    const e = EPI[spread < 0.18 ? "balanced" : top];

    stage.innerHTML = `
      <section class="scene">
        <p class="eyebrow">Ithaca · Twenty years late</p>
        <div class="epithet">
          <span class="gkw">${e[0]}</span>
          <span class="trans">${e[1]}</span>
          <p>${e[2]}</p>
        </div>

        <div class="guide">
          <p class="guide-h">Everyone you need to recognise</p>
          <div class="who">
            ${WHO.map(w => `<div><b class="nm">${w[0]}</b>${w[1]}</div>`).join("")}
          </div>
        </div>

        <div class="guide">
          <p class="guide-h">Five words that unlock the whole thing</p>
          <div class="words">
            ${WORDS.map(w => `<div><span class="gkw">${w[0]}</span><span class="say">${w[1]}</span><p>${w[2]}</p></div>`).join("")}
          </div>
        </div>

        <div class="guide">
          <p class="guide-h">Four things that will surprise you in the cinema</p>
          <div class="notes">
            ${NOTES.map(n => `<div><b>${n[0]}</b><p>${n[1]}</p></div>`).join("")}
          </div>
        </div>

        <div class="guide">
          <p class="guide-h">Who is playing who</p>
          <div class="cast">
            ${CAST.map(c => `<div class="castrow">
              ${portrait(c[1])}
              <div class="castmeta">
                <span class="who-name">${c[0]}</span>
                <span class="actor">${c[1]}</span>
                ${c[2] ? `<span class="note">${c[2]}</span>` : ""}
              </div>
            </div>`).join("")}
          </div>
          <details class="attrib">
            <summary>Portrait credits</summary>
            <p>Chapter engravings by <b>John Flaxman</b>, from <i>The Odyssey of Homer</i> (1793), public domain, inverted and cropped. Portraits from Wikimedia Commons, cropped and resized, each still under its original licence.</p>
            <ul>
              ${CAST.map(c => CREDIT[norm(c[1])]
                ? `<li><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(CREDIT[norm(c[1])][0])}" target="_blank" rel="noopener noreferrer">${c[1]}</a> — ${CREDIT[norm(c[1])][1]}, ${CREDIT[norm(c[1])][2]}</li>`
                : `<li>${c[1]} — no freely licensed photograph available, shown as initials</li>`).join("")}
            </ul>
          </details>
        </div>

        <div class="guide">
          <p class="guide-h">What to expect in the room</p>
          <div class="expect">
            ${EXPECT.map(e => `<div><b>${e[0]}</b><p>${e[1]}</p></div>`).join("")}
          </div>
        </div>

        <div class="guide">
          <p class="guide-h">The one-sentence version</p>
          <p class="prose" style="font-size:19px;margin-top:16px">A soldier spends ten years winning a war and ten more trying to get home, turns down eternal life to do it, comes back disguised as a beggar to a house full of men eating his food and courting his wife, kills every one of them, and then has to prove to that wife that he is really himself — by knowing what their bed is made of.</p>
        </div>

        <div class="actions">
          <button class="go ghost" id="again">Run it again</button>
        </div>

        <div class="credit">
          <div class="credit-row">
            <span class="upd-mark" role="img" aria-label="Unpredator"></span>
            <p class="credit-name">Unpredator</p>
          </div>
          <p>A fun experiment by <b>Unpredator LLC</b>. No client asked for this one. We build brand strategy and human-centric AI for a living, and we wanted to find out how much of a three thousand year old poem actually fits into five minutes.</p>
          <p>Turns out: most of it, if you let people make the choices instead of reading them a summary.</p>
          <p><a class="upd-link" href="https://unpredator.com" target="_blank" rel="noopener noreferrer">Learn more at unpredator.com <span class="arrow" aria-hidden="true">&rarr;</span></a></p>
          <p class="credit-tag">Stay Wild. Stay Human.</p>
        </div>
      </section>`;

    document.getElementById("again").onclick = () => {
      idx = 0; target = 0;
      for (const k in traits) traits[k] = 0;
      paintMeters();
      render();
    };
    scrollTo({ top: 0, behavior: calm ? "auto" : "smooth" });
  }

  paintMeters();
  title();
})();
